<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Range</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#4fc3c9}a:hover{color:#7fd8dc}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #121418; color: #f2f2f0; font-family: system-ui, -apple-system, Roboto, sans-serif; display: flex; flex-direction: column">
<div style="flex: 1; display: flex; flex-direction: column; gap: 20px; padding: 56px 20px 12px">
<h1 style="margin: 0; font-size: 22px">Your range</h1>
<div style="background: #1e2127; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<div><div style="color: #8b909a; font-size: 13px">Lowest</div><div style="font-size: 40px; font-weight: 700">G2</div></div>
<div style="text-align: right"><div style="color: #8b909a; font-size: 13px">Highest</div><div style="font-size: 40px; font-weight: 700">A4</div></div>
</div>
<div style="position: relative; height: 14px; border-radius: 7px; background: #343841">
<div style="position: absolute; top: 0; bottom: 0; left: 18%; right: 30%; border-radius: 7px; background: {{accent}}"></div>
</div>
<div style="display: flex; justify-content: space-between; color: #8b909a; font-size: 12px"><span>C2</span><span>C4</span><span>C6</span></div>
<div style="font-size: 15px">About 2 octaves · <span style="color: {{accent}}; font-weight: 600">Baritone</span></div>
</div>
<div style="background: #1e2127; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 10px; align-items: center; text-align: center">
<div style="color: #8b909a; font-size: 13px">Step 1 of 2</div>
<div style="font-size: 18px; font-weight: 600">Slide down to your lowest comfortable note</div>
<div style="color: #8b909a; font-size: 14px">Hold it for about a second</div>
<div style="font-size: 56px; font-weight: 700; color: #5ad17e; margin-top: 6px">A2</div>
<div style="width: 100%; height: 8px; border-radius: 4px; background: #343841; overflow: hidden"><div style="width: 65%; height: 100%; background: #5ad17e"></div></div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="color: #8b909a; font-size: 13px">History</div>
<div style="display: flex; justify-content: space-between; font-size: 15px; padding: 10px 0; border-bottom: 1px solid #343841"><span>Today</span><span>G2 – A4</span></div>
<div style="display: flex; justify-content: space-between; font-size: 15px; padding: 10px 0; border-bottom: 1px solid #343841"><span>3 Nov</span><span>A2 – G4</span></div>
</div>
<button style="margin-top: auto; height: 52px; border-radius: 26px; border: 0; background: {{accent}}; color: #0b2426; font: inherit; font-size: 16px; font-weight: 600">Test my range again</button>
</div>
<nav style="display: flex; border-top: 1px solid #343841; padding-bottom: 16px">
<a href="Main.dc.html" style="flex: 1; height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #8b909a; text-decoration: none; font-size: 12px"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 18a10 10 0 0 1 16 0"></path><path d="M12 18l4-7"></path></svg>Tuner</a>
<a href="Warmups.dc.html" style="flex: 1; height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #8b909a; text-decoration: none; font-size: 12px"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>Warm-ups</a>
<a href="Range.dc.html" style="flex: 1; height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: {{accent}}; text-decoration: none; font-size: 12px"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v4"></path></svg>Range</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#4fc3c9"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#4fc3c9' };
}
}
</script>
</body>
</html>
