<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Exercise</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#4fc3c9}a:hover{color:#7fd8dc}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #121418; color: #f2f2f0; font-family: system-ui, -apple-system, Roboto, sans-serif; display: flex; flex-direction: column; gap: 18px; padding: 56px 20px 32px">
<div style="display: flex; align-items: center; gap: 8px">
<a href="Warmups.dc.html" aria-label="Back to warm-ups" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #f2f2f0; margin-left: -12px"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"></path></svg></a>
<div style="flex: 1">
<div style="font-size: 18px; font-weight: 600">5-note scale</div>
<div style="color: #8b909a; font-size: 13px">Rep 4 of 12 · starting on B♭2</div>
</div>
</div>
<div style="display: flex; gap: 8px">
<div style="flex: 1; height: 40px; border-radius: 20px; background: #1e2127; color: #8b909a; display: flex; align-items: center; justify-content: center; font-size: 14px">Listen</div>
<div style="flex: 1; height: 40px; border-radius: 20px; background: {{accent}}; color: #0b2426; font-weight: 600; display: flex; align-items: center; justify-content: center; font-size: 14px">Your turn</div>
</div>
<div style="position: relative; height: 360px; background: #1e2127; border-radius: 16px; overflow: hidden">
<sc-for list="{{bands}}" as="b" hint-placeholder-count="9">
<div style="position: absolute; left: {{b.left}}; top: {{b.top}}; width: 32px; height: 22px; border-radius: 6px; background: {{b.fill}}; border: 1px solid {{b.edge}}; box-sizing: border-box"></div>
</sc-for>
<svg aria-hidden="true" width="350" height="360" viewBox="0 0 350 360" style="position: absolute; left: 0; top: 0"><path d="M18 306 C30 302 40 300 52 300 S78 268 90 264 S118 230 130 226 S158 192 170 190 S188 160 196 154" fill="none" stroke="#f2f2f0" stroke-width="3" stroke-linecap="round"></path><circle cx="196" cy="154" r="5" fill="#f2f2f0"></circle></svg>
<div style="position: absolute; left: 12px; bottom: 8px; color: #8b909a; font-size: 12px">B♭2</div>
<div style="position: absolute; left: 12px; top: 8px; color: #8b909a; font-size: 12px">F3</div>
</div>
<div style="display: flex; justify-content: space-between; align-items: baseline">
<div><div style="color: #8b909a; font-size: 13px">Now</div><div style="font-size: 40px; font-weight: 700; color: #5ad17e">E♭3</div></div>
<div style="text-align: right"><div style="color: #8b909a; font-size: 13px">This rep</div><div style="font-size: 40px; font-weight: 700">86%</div></div>
</div>
<div style="display: flex; gap: 12px; margin-top: auto">
<button style="flex: 1; height: 52px; border-radius: 26px; border: 0; background: #1e2127; color: #f2f2f0; font: inherit; font-size: 16px">Pause</button>
<button style="flex: 1; height: 52px; border-radius: 26px; border: 0; background: {{accent}}; color: #0b2426; font: inherit; font-size: 16px; font-weight: 600">Next rep</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#4fc3c9"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var steps = [0, 2, 4, 5, 7, 5, 4, 2, 0];
var done = 4;
var bands = steps.map(function (s, i) {
var sung = i < done;
return {
left: (18 + i * 36) + 'px',
top: (295 - s * 20) + 'px',
fill: sung ? 'rgba(90,209,126,.22)' : 'rgba(79,195,201,.14)',
edge: sung ? '#5ad17e' : '#4fc3c9'
};
});
return { accent: this.props.accent ?? '#4fc3c9', bands: bands };
}
}
</script>
</body>
</html>
