<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Warm-ups</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#4fc3c9}a:hover{color:#7fd8dc}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #121418; color: #f2f2f0; font-family: system-ui, -apple-system, Roboto, sans-serif; display: flex; flex-direction: column">
<div style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 56px 20px 12px">
<div>
<h1 style="margin: 0; font-size: 22px">Warm-ups</h1>
<div style="color: #8b909a; font-size: 14px; margin-top: 4px">Fitted to your range, G2 – A4</div>
</div>
<sc-for list="{{exercises}}" as="ex" hint-placeholder-count="5">
<a href="Exercise.dc.html" style="display: flex; align-items: center; gap: 14px; background: #1e2127; border-radius: 16px; padding: 16px; text-decoration: none; color: #f2f2f0; min-height: 44px">
<div style="flex: 1">
<div style="font-size: 16px; font-weight: 600">{{ex.name}}</div>
<div style="color: #8b909a; font-size: 13px; margin-top: 2px">{{ex.pattern}}</div>
</div>
<div style="color: #8b909a; font-size: 13px; text-align: right">{{ex.best}}</div>
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8b909a" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"></path></svg>
</a>
</sc-for>
</div>
<nav style="display: flex; border-top: 1px solid #343841; padding-bottom: 16px">
<a href="Main.dc.html" style="flex: 1; height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #8b909a; text-decoration: none; font-size: 12px"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 18a10 10 0 0 1 16 0"></path><path d="M12 18l4-7"></path></svg>Tuner</a>
<a href="Warmups.dc.html" style="flex: 1; height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: {{accent}}; text-decoration: none; font-size: 12px"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>Warm-ups</a>
<a href="Range.dc.html" style="flex: 1; height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #8b909a; text-decoration: none; font-size: 12px"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v4"></path></svg>Range</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#4fc3c9"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
accent: this.props.accent ?? '#4fc3c9',
exercises: [
{ name: '5-note scale', pattern: '1-2-3-4-5-4-3-2-1', best: 'Best 82%' },
{ name: 'Triad arpeggio', pattern: '1-3-5-8-5-3-1', best: 'Best 74%' },
{ name: 'Chromatic', pattern: 'Semitones up and down', best: '–' },
{ name: 'Fifth jumps', pattern: '1-5-1, then 1-5-8-5-1', best: '–' },
{ name: 'Siren', pattern: 'Slide across your whole range', best: '–' }
]
};
}
}
</script>
</body>
</html>
