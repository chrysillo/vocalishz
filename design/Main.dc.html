body{margin:0}
a{color:#4fc3c9}a:hover{color:#7fd8dc}

<div style="flex: 1; display: flex; flex-direction: column; gap: 22px; padding: 56px 20px 12px">
<div style="display: flex; gap: 8px">
<button style="flex: 1; height: 42px; border-radius: 21px; border: 0; background: {{accent}}; color: #0b2426; font: inherit; font-size: 14px; font-weight: 600">Chromatic</button>
<button style="flex: 1; height: 42px; border-radius: 21px; border: 0; background: #1e2127; color: #f2f2f0; font: inherit; font-size: 14px">Guitar</button>
<button style="flex: 1; height: 42px; border-radius: 21px; border: 0; background: #1e2127; color: #f2f2f0; font: inherit; font-size: 14px">Bass</button>

</div>
<div style="text-align: center; margin-top: 24px">
<div style="font-size: 110px; font-weight: 700; line-height: 1; color: #5ad17e">A<span style="font-size: 36px; font-weight: 600; color: #8b909a; vertical-align: top; margin-left: 4px">2</span></div>
<div style="color: #8b909a; font-size: 15px; margin-top: 8px">110.2 Hz · +3 cents</div>
</div>
<div style="position: relative; height: 84px">
<div style="position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; color: #8b909a; font-size: 13px"><span>♭ flat</span><span>sharp ♯</span></div>
<div style="position: absolute; top: 24px; bottom: 24px; left: 0; right: 0; border-radius: 12px; background: #1e2127; overflow: hidden">
<div style="position: absolute; top: 0; bottom: 0; left: 45%; width: 10%; background: rgba(90,209,126,.18)"></div>
<div style="position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; background: #8b909a"></div>
</div>
<div style="position: absolute; top: 28px; bottom: 28px; left: 53%; width: 6px; margin-left: -3px; border-radius: 3px; background: #5ad17e"></div>
<div style="position: absolute; bottom: 0; left: 0; right: 0; display: flex; justify-content: space-between; color: #8b909a; font-size: 12px"><span>−50</span><span>0</span><span>+50</span></div>
</div>
<div style="text-align: center; color: #8b909a; font-size: 13px">In tune</div>
<div style="margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 14px; color: #8b909a; font-size: 15px">
<button aria-label="Lower reference" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: #1e2127; color: #f2f2f0; font-size: 22px">−</button>
<span style="min-width: 110px; text-align: center; color: #f2f2f0">A4 = 440 Hz</span>
<button aria-label="Raise reference" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: #1e2127; color: #f2f2f0; font-size: 22px">+</button>
</div>
</div>
