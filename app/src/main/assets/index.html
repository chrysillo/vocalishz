<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Vocalishz</title>
<style>
  :root { --bg:#121418; --fg:#f2f2f0; --muted:#8b909a; --card:#1e2127; --line:#343841;
    --accent:#4fc3c9; --good:#5ad17e; --warn:#ffb547; --bad:#ff6b6b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; touch-action:manipulation; user-select:none; }
  body { display:flex; flex-direction:column; }
  .view { flex:1; display:none; flex-direction:column; padding:20px 20px 12px; gap:22px; max-width:480px; width:100%; margin:0 auto; overflow-y:auto; }
  .view.on { display:flex; }
  h1 { margin:0; font-size:22px; }

  /* tabs */
  nav { display:flex; border-top:1px solid var(--line); background:var(--bg); }
  nav button { flex:1; height:64px; border:0; background:none; color:var(--muted); font:inherit; font-size:12px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; }
  nav button svg { width:24px; height:24px; }
  nav button.on { color:var(--accent); }

  /* tuner */
  .chips { display:flex; gap:8px; }
  .chips button { flex:1; height:42px; border-radius:21px; border:0; background:var(--card); color:var(--fg); font:inherit; font-size:14px; }
  .chips button.on { background:var(--accent); color:#0b2426; font-weight:600; }
  .readout { text-align:center; margin-top:8px; }
  .note { font-size:110px; font-weight:700; line-height:1; transition:color .15s; }
  .note sup { font-size:36px; font-weight:600; color:var(--muted); vertical-align:top; margin-left:4px; position:relative; top:14px; }
  .note.idle { color:var(--line); }
  .note.good { color:var(--good); }
  .sub { color:var(--muted); font-size:15px; margin-top:8px; font-variant-numeric:tabular-nums; min-height:20px; }
  .meter { position:relative; height:84px; }
  .scale { position:absolute; inset:24px 0 24px; border-radius:12px; background:var(--card); overflow:hidden; }
  .zone { position:absolute; top:0; bottom:0; left:45%; width:10%; background:rgba(90,209,126,.18); }
  .tick { position:absolute; top:8px; bottom:8px; width:2px; background:var(--line); transform:translateX(-1px); }
  .tick.mid { background:var(--muted); top:0; bottom:0; }
  .needle { position:absolute; top:12px; bottom:12px; left:50%; width:6px; margin-left:-3px; border-radius:3px;
    background:var(--muted); transition:left .08s linear, background .15s, opacity .3s; opacity:0; }
  .meter-labels { position:absolute; bottom:0; left:0; right:0; display:flex; justify-content:space-between; color:var(--muted); font-size:12px; }
  .flat-sharp { position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between; color:var(--muted); font-size:13px; }
  .strings { display:flex; gap:8px; justify-content:center; min-height:58px; }
  .strings button { flex:1; max-width:64px; height:58px; border-radius:14px; border:2px solid transparent; background:var(--card);
    color:var(--fg); font:inherit; font-size:18px; font-weight:600; }
  .strings button small { display:block; font-size:11px; color:var(--muted); font-weight:400; }
  .strings button.near { border-color:var(--accent); }
  .strings button.good { border-color:var(--good); background:rgba(90,209,126,.15); }
  .hint { text-align:center; color:var(--muted); font-size:13px; margin-top:-8px; }
  .ref { display:flex; align-items:center; justify-content:center; gap:14px; color:var(--muted); font-size:15px; margin-top:auto; }
  .ref button { width:44px; height:44px; border-radius:12px; border:0; background:var(--card); color:var(--fg); font-size:22px; }
  .ref output { min-width:110px; text-align:center; color:var(--fg); font-variant-numeric:tabular-nums; }
  .msg { text-align:center; color:var(--warn); font-size:14px; min-height:18px; }

  .soon { margin:auto 0; text-align:center; color:var(--muted); line-height:1.5; }
  .soon h2 { color:var(--fg); margin:0 0 8px; }
</style>
</head>
<body>

<section class="view on" id="v-tuner">
  <div class="chips" id="modes">
    <button data-m="chromatic" class="on">Chromatic</button>
    <button data-m="guitar">Guitar</button>
    <button data-m="bass">Bass</button>
    <button data-m="ukulele">Ukulele</button>
  </div>

  <div class="readout">
    <div class="note idle" id="note">–</div>
    <div class="sub" id="sub">Play or sing a note</div>
  </div>

  <div class="meter">
    <div class="flat-sharp"><span>♭ flat</span><span>sharp ♯</span></div>
    <div class="scale" id="scale"><div class="zone"></div></div>
    <div class="needle" id="needle"></div>
    <div class="meter-labels"><span>−50</span><span>0</span><span>+50</span></div>
  </div>

  <div class="strings" id="strings"></div>
  <div class="hint" id="hint"></div>
  <div class="msg" id="msg"></div>

  <div class="ref">
    <button id="refDown" aria-label="Lower reference">−</button>
    <output id="refOut">A4 = 440 Hz</output>
    <button id="refUp" aria-label="Raise reference">+</button>
  </div>
</section>

<section class="view" id="v-warmup">
  <div class="soon"><h2>Warm-ups</h2>Scales, arpeggios, chromatics and fifth jumps,<br>built around your range. Coming next.</div>
</section>

<section class="view" id="v-range">
  <div class="soon"><h2>Your range</h2>Sing your lowest and highest notes<br>to set up your warm-ups. Coming next.</div>
</section>

<nav id="tabs">
  <button data-v="tuner" class="on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 18a10 10 0 0 1 16 0"/><path d="M12 18l4-7"/><circle cx="12" cy="18" r="1.5" fill="currentColor"/></svg>
    Tuner</button>
  <button data-v="warmup">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    Warm-ups</button>
  <button data-v="range">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>
    Range</button>
</nav>

<script>
(function () {
  var NATIVE = !!window.Android;
  var $ = function (id) { return document.getElementById(id); };
  var NAMES = ['C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'A♯', 'B'];
  var INSTRUMENTS = {
    guitar: [40, 45, 50, 55, 59, 64],   // E2 A2 D3 G3 B3 E4
    bass: [28, 33, 38, 43],             // E1 A1 D2 G2
    ukulele: [67, 60, 64, 69]           // G4 C4 E4 A4 (re-entrant)
  };
  var IN_TUNE = 5; // cents

  var st = { mode: 'chromatic', a4: 440 };
  try { var s = JSON.parse(localStorage.getItem('vocalishz') || '{}');
    if (s.mode === 'chromatic' || INSTRUMENTS[s.mode]) st.mode = s.mode;
    if (s.a4 >= 415 && s.a4 <= 466) st.a4 = s.a4; } catch (e) {}
  function save() { try { localStorage.setItem('vocalishz', JSON.stringify(st)); } catch (e) {} }

  function midiToHz(m) { return st.a4 * Math.pow(2, (m - 69) / 12); }
  function hzToMidi(hz) { return 69 + 12 * Math.log2(hz / st.a4); }
  function label(m) { return NAMES[((m % 12) + 12) % 12]; }
  function octave(m) { return Math.floor(m / 12) - 1; }

  // ---- tabs ----
  var view = 'tuner';
  $('tabs').onclick = function (e) {
    var b = e.target.closest('button'); if (!b) return;
    view = b.dataset.v;
    [].forEach.call(this.children, function (x) { x.classList.toggle('on', x === b); });
    ['tuner', 'warmup', 'range'].forEach(function (v) { $('v-' + v).classList.toggle('on', v === view); });
    micForView();
  };
  function micForView() {
    if (!NATIVE) return;
    if (view === 'tuner') Android.startMic(); else Android.stopMic();
  }

  // ---- meter ticks ----
  for (var c = -50; c <= 50; c += 10) {
    var t = document.createElement('div');
    t.className = 'tick' + (c === 0 ? ' mid' : '');
    t.style.left = (50 + c) + '%';
    $('scale').appendChild(t);
  }

  // ---- modes and strings ----
  function renderModes() {
    [].forEach.call($('modes').children, function (b) { b.classList.toggle('on', b.dataset.m === st.mode); });
    var box = $('strings'); box.innerHTML = '';
    var list = INSTRUMENTS[st.mode];
    $('hint').textContent = list ? 'Tap a string to hear its note' : '';
    if (!list) return;
    list.forEach(function (m, i) {
      var b = document.createElement('button');
      b.dataset.midi = m;
      b.innerHTML = label(m) + '<small>' + label(m) + octave(m) + '</small>';
      b.onclick = function () { playRef(m); };
      box.appendChild(b);
    });
  }
  $('modes').onclick = function (e) {
    var b = e.target.closest('button'); if (!b) return;
    st.mode = b.dataset.m; save(); renderModes(); reset();
  };

  // ---- reference pitch ----
  function renderRef() { $('refOut').textContent = 'A4 = ' + st.a4 + ' Hz'; }
  $('refDown').onclick = function () { if (st.a4 > 415) { st.a4--; save(); renderRef(); } };
  $('refUp').onclick = function () { if (st.a4 < 466) { st.a4++; save(); renderRef(); } };

  // ---- reference tones (mic input is ignored while one plays) ----
  var muteUntil = 0;
  function playRef(m) {
    if (!NATIVE) return;
    Android.playTone(midiToHz(m), 1.6);
    muteUntil = Date.now() + 1800;
  }

  // ---- pitch handling ----
  var recent = [], smooth = null, lastSeen = 0;
  function median(a) { var b = a.slice().sort(function (x, y) { return x - y; }); return b[b.length >> 1]; }

  function reset() {
    recent = []; smooth = null;
    $('note').className = 'note idle'; $('note').textContent = '–';
    $('sub').textContent = 'Play or sing a note';
    $('needle').style.opacity = 0;
    [].forEach.call($('strings').children, function (b) { b.className = ''; });
  }

  window.onPitch = function (hz, clarity) {
    if (Date.now() < muteUntil) return;
    if (!hz || clarity < 0.85) {
      if (lastSeen && Date.now() - lastSeen > 900) { lastSeen = 0; reset(); }
      return;
    }
    lastSeen = Date.now();
    recent.push(hz); if (recent.length > 5) recent.shift();
    var f = median(recent);

    var target, list = INSTRUMENTS[st.mode], midi = hzToMidi(f);
    if (list) {
      target = list.reduce(function (best, m) { return Math.abs(m - midi) < Math.abs(best - midi) ? m : best; }, list[0]);
    } else {
      target = Math.round(midi);
    }
    var cents = (midi - target) * 100;
    smooth = smooth === null ? cents : smooth + (cents - smooth) * 0.35;
    show(target, smooth, f);
  };

  function show(m, cents, hz) {
    var good = Math.abs(cents) <= IN_TUNE;
    var note = $('note');
    note.className = 'note' + (good ? ' good' : '');
    note.innerHTML = label(m) + '<sup>' + octave(m) + '</sup>';
    var r = Math.round(cents);
    $('sub').textContent = (good ? 'In tune' : (r > 0 ? '+' + r : r) + ' cents' + (r > 0 ? ' · tune down' : ' · tune up')) +
      '  ·  ' + hz.toFixed(1) + ' Hz';
    var n = $('needle');
    n.style.opacity = 1;
    n.style.left = (50 + Math.max(-50, Math.min(50, cents))) + '%';
    n.style.background = good ? 'var(--good)' : Math.abs(cents) <= 20 ? 'var(--warn)' : 'var(--bad)';
    [].forEach.call($('strings').children, function (b) {
      b.className = +b.dataset.midi === m ? (good ? 'good' : 'near') : '';
    });
  }

  window.onMicState = function (state) {
    $('msg').textContent = state === 'denied' ? 'Microphone access is off. Allow it in Settings > Apps > Vocalishz.' : '';
  };

  renderModes(); renderRef();
  if (!NATIVE) $('msg').textContent = 'Open in the Android app to use the microphone.';
  micForView();
})();
</script>
</body>
</html>
